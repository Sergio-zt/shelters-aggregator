[project]
name = "shelters-aggregator"
version = "0.1.0"
description = "Shelters Aggregator API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.148.0,<0.149.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", ".venv", "__pycache__"]
jobs = 1